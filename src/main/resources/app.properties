# ---------------------------------------------------------------------------
# Cấu hình ứng dụng. Có thể ghi đè bằng:
#   - file src/main/resources/app-local.properties (không commit), hoặc
#   - system property cùng tên với tiền tố "shop.", ví dụ -Dshop.db.url=...
# ${user.home} được thay bằng thư mục người dùng.
# ---------------------------------------------------------------------------

# --- Cơ sở dữ liệu (mặc định: H2 nhúng, chế độ tương thích MySQL) ---
db.driver=org.h2.Driver
db.url=jdbc:h2:file:${user.home}/clothing-shop/data/shop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
db.username=sa
db.password=
db.poolSize=10
# Tạo dữ liệu mẫu khi CSDL còn trống
db.seed=true

# --- MySQL (bỏ comment và tạo database clothing_shop với utf8mb4) ---
# db.driver=com.mysql.cj.jdbc.Driver
# db.url=jdbc:mysql://localhost:3306/clothing_shop?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
# db.username=root
# db.password=

# --- Ảnh sản phẩm tải lên ---
upload.dir=${user.home}/clothing-shop/uploads
upload.maxBytes=2097152

# --- Đơn hàng ---
# Đơn VNPAY quá hạn thanh toán (phút) sẽ tự huỷ
order.vnpayTimeoutMinutes=15

# --- VNPAY ---
# mock    : cổng giả lập chạy ngay trong ứng dụng (demo, không cần tài khoản VNPAY)
# sandbox : cổng thử nghiệm thật của VNPAY — cần đăng ký để có tmnCode / hashSecret
vnpay.mode=mock
vnpay.payUrl=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.tmnCode=DEMOSHOP
vnpay.hashSecret=MOCK_SECRET_FOR_LOCAL_DEMO_ONLY
vnpay.returnPath=/payment/vnpay-return
