# ---------------------------------------------------------------------------
# Chạy bằng Docker Compose — mặc định dùng H2 nhúng, dữ liệu nằm trong volume "shop-data".
#   docker compose up -d --build
# Dùng MySQL:
#   docker compose -f docker-compose.yml -f docker-compose.mysql.yml up -d --build
# Biến cấu hình đặt trong file .env (chép từ .env.example).
# ---------------------------------------------------------------------------
name: clothing-shop

services:
  app:
    build: .
    image: clothing-shop:latest
    restart: unless-stopped
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      SHOP_DB_SEED: ${SHOP_DB_SEED:-true}
      SHOP_ORDER_VNPAYTIMEOUTMINUTES: ${SHOP_ORDER_VNPAYTIMEOUTMINUTES:-15}
      SHOP_VNPAY_MODE: ${SHOP_VNPAY_MODE:-mock}
      SHOP_VNPAY_TMNCODE: ${SHOP_VNPAY_TMNCODE:-DEMOSHOP}
      SHOP_VNPAY_HASHSECRET: ${SHOP_VNPAY_HASHSECRET:-MOCK_SECRET_FOR_LOCAL_DEMO_ONLY}
    volumes:
      - shop-data:/data

volumes:
  shop-data:
